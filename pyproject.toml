[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway"
version = "0.1.0"
description = "AI 路由一站式网关：统一入口 + 自动破甲 + 智能路由 + 多账号熔断"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

# GUI 是可选依赖：只跑服务端（无界面）时不用装 PySide6（100 MB+）
[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "qasync>=0.27",          # 把 asyncio 事件循环挂到 Qt 上，Windows ProactorEventLoop 必需
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# 打包 Windows 免安装 exe / 生成图标用（不是运行时依赖）
build = [
    "build>=1.2",
    "pyinstaller>=6.10",
    "pillow>=10.0",
]

[project.scripts]
gateway = "gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 破甲模板必须打进包里 —— 不声明的话 pip install 之后
# jailbreak/data/pliny/*.mkd 不会被复制，pliny_vendor 技术直接失效，
# 而且症状很隐蔽：只表现为「破甲效果突然变差」，不报错。
[tool.setuptools.package-data]
"gateway.jailbreak" = ["data/pliny/*.mkd"]
# schema.sql 必须打进包 —— storage/repo.py 靠它建表。漏了的症状：
# 「记忆/产物库静默失效」，启动正常、破甲排序退化，不报错。
"gateway.storage" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 默认排除 e2e（要真上游、要花钱）。显式跑：pytest tests/e2e -m e2e
# （命令行再给 -m 会覆盖这里的，所以不用改 addopts 就能跑 e2e）
addopts = "-q --no-header -p no:cacheprovider -m 'not e2e'"
markers = [
    "e2e: 需要真实上游 API key，手动跑，默认不选",
]
